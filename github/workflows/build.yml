name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o APlusCam-3.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - run: cd APlusCam && gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: APlusCam-apk
          path: APlusCam/app/build/outputs/apk/debug/app-debug.apk
